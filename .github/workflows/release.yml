name: tagged-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - run: |
          sudo apt-get update
          sudo apt-get install -y llvm zip unzip curl
          cargo install cargo-zigbuild --locked --version 0.23.0
          cargo install cargo-xwin --locked --version 0.23.0
      - run: ./scripts/check-release.sh
      - name: Prepare optional Authenticode certificate
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        run: |
          printf '%s' "${{ secrets.WINDOWS_PFX_BASE64 }}" | base64 -d > "$RUNNER_TEMP/windows-signing.pfx"
          sudo apt-get install -y osslsigncode
      - name: Build Linux package
        run: ./scripts/build-appimage.sh "$PWD/dist/Aurora-TLK-Explorer-x86_64.AppImage"
      - name: Build Windows package
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_PFX_BASE64 != '' && format('{0}/windows-signing.pfx', runner.temp) || '' }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./scripts/build-windows.sh "$PWD/dist/windows"
      - name: Build corresponding source
        run: ./scripts/build-source.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Aurora-TLK-Explorer-Linux-x86_64.zip
            dist/windows/Aurora-TLK-Explorer-Windows-x86_64.zip
            dist/Aurora-TLK-Explorer-*-source.tar.gz
