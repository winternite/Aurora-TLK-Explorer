[package]
name = "aurora-tlk-explorer"
version = "1.1.1"
edition = "2024"
description = "A native editor for Neverwinter Nights TLK, 2DA, and ITP files"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.35.0", path = "vendor/egui_extras" }
encoding_rs = "0.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# wayland-scanner 0.31.10 restricts quick-xml to the advisory-affected 0.39
# series. This source-identical vendored copy widens that dependency to the
# compatible, fixed 0.41 series until upstream publishes a release.
wayland-scanner = { path = "vendor/wayland-scanner" }
# eframe does not currently forward desktop startup/activation tokens to
# egui-winit windows. This small local patch lets KWin associate an XWayland
# window with the launch context while retaining native file drag-and-drop.
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
lto = "thin"
strip = true
opt-level = 2
